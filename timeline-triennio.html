<script id="embedded" type="application/json">{"headers": ["Name", "Description", "Time", "Group ID", "url immagine"], "rows": [["La comparsa della flotta francese sul golfo di Palmas", "Nelle acque del golfo di Cagliari comparve una flotta francese, guidata dal comandante Truguet, che si sarebbe dovuta ancorare nel Golfo di Palmas (costa Sud-occidentale della Sardegna), ma a causa di una forte libecciata, dovette ripiegare verso Napoli e verso le coste africane. La comparsa improvvisa della flotta francese mise in allarme la popolazione anche se non fu una sorpresa, dato che la Segreteria degli Interni mise al corrente il viceré Balbiano, con il dispaccio del 26 settembre 1792, di un possibile attacco, ma questo, nonostante fosse stato informato tempestivamente, non preparò la difesa dell’isola in maniera adeguata. Inoltre le poche misure per la difesa furono adottate senza mai coinvolgere né lo Stamento militare né la Reale Udienza, come invece sancivano le leggi fondamentali del Regno. Nella popolazione regnava la paura e in seno agli Stamenti cominciava a balenare l’idea di riunirsi per poter organizzare la difesa dell’isola, vista l’indolenza del viceré.", "1792 12 21", "", ""], ["L'autoconvocazione dello Stamento militare", "Nella mattinata del 4 gennaio, si autoconvocò a Cagliari nella chiesa del Santo Monte lo Stamento militare, composto solo dai membri residenti in città, sotto la presidenza di Francesco Maria Amat marchese di Villarios. L’autoconvocazione fu resa necessaria come reazione all’immobilità del viceré Balbiano sul fronte della difesa contro l’invasore francese. L’ordine del giorno fu proprio quello di organizzare la difesa della città di Cagliari prima del ritorno dei francesi, in quel momento diretti verso Carloforte e Sant’Antioco. \nDa questo momento, i rapporti col viceré cominciarono a deteriorarsi in maniera sempre più evidente.", "1793 1 4", "", ""], ["Preparazione dell'attacco su Carloforte", "Iniziarono le operazioni per la presa di Carloforte sotto il comando del contrammiraglio La Touche-Tréville. Il comandante sardo De Nobili provvide a mettere in salvo una parte della popolazione (i tabarchini non vollero abbandonare l’sola) e rese inservibili le artiglierie.", "1793 1 7", "37471", ""], ["Lo sbarco francese a Carloforte", "I francesi sbarcarono a Carloforte senza incontrare alcuna resistenza. Stando a quanto riportato dalle fonti francesi, furono accolti con enorme entusiasmo dalla popolazione che fu infiammata dai discorsi di Filippo Buonarroti.", "1793 1 8", "37471", ""], ["L'isola della Libertà", "L’isola di San Pietro venne ribattezzata col nome di Isola della Libertà e, al posto della statua del re Carlo Emanuele III, venne innalzato l'albero della libertà. Filippo Buonarroti curò la redazione della nuova costituzione dell’isola e molto probabilmente fu applicato per la prima volta lo schema costituzionale repubblicano che era stato approvato dall'Assemblea Costituente francese.", "1793 1 10", "37471", ""], ["Lo sbarco", "Il 14 gennaio, il contrammiraglio Truguet, sferrò l’attacco. Truguet inviò un parlamentare per intimare la resa per consentire lo sgombero della popolazione. Il comandante sardo Camurati della Roncaglia si rese però conto che i nemici stavano operando uno sbarco a Calasetta e per tutta risposta fece prigioniero il parlamentare e mise in salvo gli abitanti. Inoltre Camurati riparò con le sue truppe sull’istmo di Santa Caterina. Le truppe francesi, a questo punto, occuparono Sant’Antioco.", "1793 1 14", "37472", ""], ["La sconfitta sull'Istmo di Santa Caterina", "Truguet decise di sferrare l’attacco finale sull’istmo di Santa Caterina ma le sue truppe furono respinte da sette miliziani del Sulcis. A questo punto, il contrammiraglio francese decise di volgere la sua rotta verso Cagliari.", "1793 1 17", "37472", ""], ["Il prestito per la difesa di Cagliari", "Con le truppe nemiche ormai in avvicinamento, lo Stamento militare trasse in prestito, in aperto scontro col viceré, una grossa somma di lire sarde per affrontare le spese necessarie alla battaglia contro i francesi.", "1793 1 17", "", ""], ["L'arrivo a Cagliari", "La flotte comandate da Truguet e da La Touche Tréville gettarono le ancore in rada a Cagliari. Truguet (che aveva il comando delle operazioni), prima di cominciare l’attacco, inviò a terra una scialuppa parlamentare per intimare la resa ai cagliaritani. La scialuppa non arrivò mai a destinazione perché venne raggiunta da una raffica di colpi sparati dai miliziani e fu così costretta a tornare indietro. Il popolo cagliaritano, dopo questo “incidente”, fu preso dal timore di feroci rappresaglie da parte dei francesi.", "1793 1 23", "37473", ""], ["Il consiglio di guerra", "Truguet convocò un consiglio di guerra sulla nave ammiraglia per pianificare lo sbarco sull'isola. I francesi decisero di tentare lo sbarco in due punti: nella piana di Gliuc (nei pressi dell'odierno Lazzaretto di Sant'Elia) e nel litorale di Quartu (attuale Margine Rosso). Gli sbarchi avrebbero dovuto consentire l'occupazione delle alture fortificate di San Bartolomeo, di Sant’Elia e di Bonaria, da cui sarebbe stato più facile bombardare la città. \nDal canto loro i cagliaritani intuirono le intenzioni francesi e misero a difesa della piana di Gliuc le truppe comandate da don Gerolamo Pitzolo e lungo il litorale quartese furono dislocati i dragoni del barone Saint-Amour e le truppe comandate dal marchese Borro di San Carlo.", "1793 2 10", "37473", ""], ["Lo sbarco a Quartu", "La flotta francese attaccò a Quartu le milizie del barone Saint-Amour che diedero segnali di sbandamento (il barone diede la colpa alla presunta codardia dei miliziani) e consentirono lo sbarco ai nemici. Nello stesso momento, nella piana di Gliuc, le milizie comandate da Pitzolo riuscirono ad impedire che i francesi toccassero terra.", "1793 2 14", "37473", ""], ["La disfatta francese", "Lo Stamento militare si riunì per discutere dei pessimi risultati sul fronte Quartese. I due comandanti Pitzolo e Saint-Amour furono convocati e gli fu ordinato di passare al contrattacco. Ma, durante l’assenza dei due comandanti, la città venne nuovamente messa sotto attacco e le truppe miliziane sbandarono ulteriormente, rendendo impossibile passare alla controffensiva. Inoltre le truppe francesi sbarcarono a Cagliari e si accamparono nelle saline per la notte. Le milizie sarde comandate da Pitzolo si nascosero vicino all’accampamento francese, predisponendo l’attacco frontale per il giorno successivo. Durante la notte, forse per l’allarme dato dalla presenza delle truppe miliziane, i francesi si scompaginarono in un attacco disordinatissimo, prendendosi a fucilate tra di loro credendo di essere attaccati. La rotta fu disastrosa e i francesi chiesero di essere reimbarcati immediatamente, cosa non possibile causa maltempo. Bisogna sottolineare che questa rotta fu auto-causata, le milizie sarde non dovettero sparare un colpo.", "1793 2 15", "37473", ""], ["Lo sbarco sull'Isola di Santo Stefano", "Le truppe franco-corse, guidate dal comandate Colonna-Cesari, sbarcarono facilmente sull’isola di Santo Stefano. Nella spedizione per la conquista de La Maddalena, era presente il giovane Napoleone Bonaparte.", "1793 2 22", "37475", ""], ["Il bombardamento verso La Maddalena", "All’alba i francesi cominciarono un intenso bombardamento su La Maddalena. Durante la notte, il generale francese Colonna-Cesari predispose lo sbarco per il giorno successivo sull'isola.", "1793 2 24", "37475", ""], ["La ritirata francese", "Durante la notte tra il 25 e il 26 febbraio, l’equipaggio di una corvetta francese si ammutinò e si apprestava a tornare a Bonifacio. Colonna-Cesari cercò in tutti i modi di riportare la calma tra i marinai riottosi, ma dopo essere stato anche minacciato di morte, si vide costretto a dare l’ordine di ritirata.", "1793 2 25", "37475", ""], ["Vittorio Amedeo III si congratula col popolo sardo", "Il sovrano Vittorio Amedeo III inviò in data 6 marzo un biglietto regio indirizzato al viceré Vincenzo Balbiano. Nel biglietto, il re esprimeva tutta la sua soddisfazione e la sua gratitudine al popolo sardo, in particolar modo allo Stamento militare che si diede da fare per rafforzare la difesa della Sardegna. Ma la parte più importante del regio biglietto era quella in cui veniva comunicato che Vittorio Amedeo III avrebbe valutato alcune proposte da parte degli Stamenti.", "1793 3 6", "", ""], ["Ripresa delle sedute stamentarie", "Le sedute stamentarie ripresero in data 26 marzo, spinte da un biglietto del viceré Balbiano indirizzato agli Stamenti. Il contenuto del biglietto riportava ciò che il sovrano riferì in data 6 marzo, ma il viceré commise l’errore di impegnare la parola del sovrano ben oltre le sue intenzioni. Anche lo Stamento ecclesiastico si fece forte del dispaccio del viceré e propose di inviare una delegazione stamentaria a Torino che comunicasse le riforme e le richieste proposte dai sardi. Inoltre, venne proposta la costituzione di una commissione interstamentaria incaricata di individuare il pacchetto di riforme da portare al re.", "1793 3 26", "", ""], ["Lo Stamento militare chiese copia autentica del dispaccio di corte", "Lo Stamento militare richiese la copia autentica del dispaccio di corte in cui il sovrano si dichiarava disposto ad accogliere eventuali richieste.", "1793 3 27", "", ""], ["Assemblea plenaria dello Stamento Militare e Reale", "Nuova assemblea plenaria dello Stamento militare a Cagliari, a cui furono invitati a partecipare 111 residenti a Cagliari e 300 nobili non residenti in città. La risposta fu massiccia ed entusiasta (su circa 584 delegati, ne parteciparono 224). L’assemblea si rendeva opportuna per ratificare le decisioni assunte dallo Stamento militare non al completo durante la guerra contro i francesi; per decidere le modalità del pagamento del debito contratto per l’arruolamento della milizia volontaria; per discutere ed approvare, secondo il dispaccio del sovrano reso noto dal viceré in data 26 marzo, “tutto ciò che possa occorrere ad assicurare ed affrettare la pubblica felicità e contentezza”.\nSempre il 29 aprile, si riunì lo Stamento Reale.", "1793 4 29 0 0", "", ""], ["I tre Stamenti riuniti contemporaneamente", "Per la prima volta, i tre Stamenti (militare, reale e ecclesiastico) si riunirono contemporaneamente a Cagliari nelle rispettive sedi. Questa fu una data di grande importanza perché, da tale giorno, i tre ordini discussero e definirono le riforme più urgenti, rimandando il risultato alla celebrazioni delle Corti, dato che l’assemblea degli stamenti non era il luogo idoneo per legiferare. La riunione dei tre ordini dimostrava che nei sardi stava cominciando a maturare un' identità nazionale del popolo sardo.", "1793 4 30", "", ""], ["Le cinque domande", "Lo stamento militare comunicò le domande agli stamenti ecclesiastico e reale. Gli stamenti ecclesiastico e reale daranno il loro assenso solo a distanza di qualche mese. \nLe cinque domande erano le seguenti: \n1) il ripristino della convocazione decennale del parlamento;\n 2) la riconferma degli antichi privilegi sanciti dalle leggi fondamentali del Regno, soppressi in gran parte dai Savoia; \n3) tutte le cariche dovevano essere assegnate ai sardi, ad esclusione di quella vicereale e di alcune cattedre vescovili e arcivescovili; \n4) la creazione a Cagliari di un Consiglio di Stato per la gestione degli affari ordinari; \n5) la creazione a Torino di un Ministero che si occupasse delle questioni sarde.", "1793 5 13", "", ""], ["Lo stamento ecclesiastico approva il testo delle cinque domande", "Lo Stamento ecclesiastico accettò tutte le cinque domande e si adoperò per scegliere i due suoi delegati da inviare a Torino.", "1793 6 12", "", ""], ["Partenza dei delegati militari", "Gerolamo Pitzolo e Antonio Sircana (delegati dello Stameto militare) si imbarcarono da Porto Torres per Torino.", "1793 6 29", "", ""], ["Lo stamento reale approva il testo delle cinque domande", "Anche lo Stamento Reale diede il suo assenso al testo delle cinque domande, anche se a puro titolo di cortesia, date le perplessità sulle ultime due richieste.", "1793 7 17", "", ""], ["Sospensione delle sedute stamentarie e partenza degli altri delegati per Torino", "Il sovrano ordinò, con regio biglietto, la sospensione di tutte le sedute stamentarie. Le sedute però continuarono fino a fine ottobre, quando gli fu intimata la sospensione dal viceré. Sempre in questa data, il resto della delegazione stamentaria ( composta da Michele Aymerich, Pietro Maria Sisternes, Giuseppe Ramasso e Domenico Simon) raggiunse a Torino Pitzolo e Sircana. La delegazione fu ricevuta solo nel mese di dicembre.", "1793 9 4", "", ""], ["Il rigetto delle \"cinque domande\"", "Un regio biglietto in data primo aprile firmato dal ministro Graneri per conto del re, respinse in toto le rivendicazioni autonomistiche contenute nelle cinque domande. La decisione non fu comunicata ai sei deputati sardi presenti a Torino ma fu data direttamente al viceré.", "1794 4 1", "", ""], ["Il vespro sardo", "Circa a mezzogiorno del 28 aprile, furono arrestati i due avvocati Vincenzo Cabras e Bernardo Pintor, entrambi membri della borghesia cagliaritana, perché accusati di essere tra i promotori della “cospirazione”. I familiari degli arrestati percorsero la città partendo dal quartiere di Stampace, trascinandosi dietro una folla inferocita, fino ad arrivare a Castello dove la folla chiese a gran voce la liberazione dei due arrestati. Dato che il viceré Balbiano si dimostrò titubante, la folla riuscì a sopraffare le guardie e diede fuoco alle porte di Castello. Nel frattempo Balbiano riuscì a fuggire e si rifugiò nel palazzo arcivescovile. Il programma della congiura prevedeva il solo arresto dei funzionari piemontesi, ma la situazione divenne incontenibile tanto che il popolo sardo, che era ormai deciso a farsi giustizia da solo, diede la caccia ai piemontesi al grido di “buttiamo a mare i piemontesi”. Tutti i piemontesi, dal viceré al più modesto funzionario, ad esclusione delle donne e dell’arcivescovo Melano (molto stimato dalla popolazione), furono messi sotto custodia.\nIntanto la Reale Udienza, operante con soli giudici sardi, prese in mano le redini del governo della Sardegna e mise in essere la prima esperienza di governo autonomo dei sardi.", "1794 4 28", "", ""], ["La cacciata dei piemontesi", "I piemontesi vennero cacciati e imbarcati da Cagliari (ad esclusione delle donne e dell'arcivescovo Melano). Nei giorni successivi, l’esempio di Cagliari fu seguito da altre città e tutti i piemontesi dovettero abbandonare la Sardegna.", "1794 4 30", "", ""], ["Manifesto giustificativo dell'emozione popolare del 28 aprile", "I tre Stamenti e la Reale Udienza si riunirono per rassicurare il governo piemontese della valenza moderata dell'insurrezione cagliaritana. Venne redatto dal sacerdote Antonio Cabras il \"Manifesto giustificativo dell'emozione popolare del 28 aprile\" che fu approvato dagli Stamenti e pubblicato.", "1794 5 6", "", ""], ["Ritorno di Pitzolo", "Gerolamo Pitzolo tornò a Cagliari insieme ad Antonio Sircana. Pitzolo fu accolto con grande stima e rispetto e fu acclamato dal popolo come \"padre della patria\".", "1794 5 19", "", ""], ["Pitzolo attacca Domenico Simon", "Pitzolo attaccò in pubblica seduta il condeputato Domenico Simon, reo di essere rimasto a Torino e quindi accusato di connivenza con la classe politica piemontese e di scarso senso patriottico. Questa dichiarazione creò una spaccatura nella classe dirigente cagliaritana che si divise in due fazioni: con Pitzolo si scherarono la maggior parte degli appartenenti agli stamenti militare e ecclesiastico insieme alla maggioranza dei componenti della Reale Udienza (Normalizzatori), mentre presero le difese di Simon la parte più innovativa dello Stamento Reale e della classe dirigente cagliaritana (Novatori). Inoltre la fazione avversa a Pitzolo era guidata da due importanti personalità come Giovanni Maria Angioy e Vincenzo Sulis. Secondo la fazione pro-Simon, le accuse di Pitzolo erano dettate dall'invidia e dalla sua voglia di primeggiare.", "1794 5 25", "", ""], ["Nomina dei quattro alti funzionari", "I dispacci con le quattro nomine arrivvarono a Cagliari il 5 luglio. Il sovrano nominò Gerolamo Pitzolo Intendente generale, Gavino Paliaccio marchese della Planargia generale delle armi, Gavino Cocco reggente della Reale Udienza, mentre ad Antioco Santuccio fu assegnato il governatorato del Capo di Sassari e del Logudoro.\nLa nomina dei quattro funzionari portò a delle contrapposizioni tra il partito di Pitzolo (i normalizzatori) e quello di Angioy (i novatori). Il partito dei novatori si oppose fermamente a quelle nomine perché ritenute fuorilegge per il mancato rispetto delle terne.", "1794 6 5", "", ""], ["Graneri sostituito nella trattazione degli affari di Sardegna", "Il tanto odiato ministro Graneri fu sostituito dal conte Pietro Avogadro di Quaregna nella trattazione degli Affari di Sardegna. Il nuovo ministro prese provvedimenti indirizzati a recepire le istanze delle cinque domande e a riportare la calma nella classe dirigente e nella popolazione sarda.", "1794 6 27", "", ""], ["L'arrivo del nuovo viceré", "Il nuovo viceré, il marchese Filippo Vivalda, giunse a Cagliari. Fu bene accolto dalla popolazione.", "1794 9 4 10 0", "", ""], ["Galli della Loggia agli Affari di Sardegna", "Il Conte Galli della Loggia divenne il nuovo ministro degli Affari di Sardegna al posto del Conte Avogadro.", "1795 3 4", "", ""], ["Nomina dei tre giudici della sala civile della Reale Udienza", "Furono nominati giudici della sala civile della Reale Udienza tre personalità sassaresi, schierate col partito dei normalizzatori, senza che venissero osservate le terne.\nGli Stamenti reagirono immediatamente a questo ennesimo affronto richiedendo l'annullamento delle nomine al viceré e la Reale Udienza accolse la loro istanza.", "1795 5 12", "", ""], ["La conferma delle nomine", "Le nomine a giudici della sala civile della Reale Udienza furono confermate tramite il dispaccio 10428. Inoltre il conte Galli della Loggia diede incarico ufficiale per la repressione di chiunque si fosse opposto alla deliberazione. Ciò conferiva una grande vittoria per Pitzolo e Planargia.", "1795 6 30", "", ""], ["Morte di Pitzolo", "Gli stamenti ( in particolare nelle persone Angioy, Sulis e Cabras del partito novatore) chiesero al viceré la destituzione di Pitzolo e Planargia mentre nella piazza del palazzo viveregio si riuniva una grande folla. Il tergiversare del viceré fece si che la folla rompesse gli indugi e andò verso la casa di Pitzolo. Pitzolo venne portato al cospetto di Vivalda che però inspiegabilmente si rifiutò di riceverlo, lasciandolo in balia della folla che lo trucidò nel mentre che veniva portato verso la prigione. \nPlanargia venne invece momentaneamente imprigionato nella Torre dell'Elefante.", "1795 7 6", "", ""], ["Lettera di Santuccio a Lord Elliot", "Il governatore Antioco Santuccio (governatore del capo di Sassari), all'insaputa del viceré e degli Stamenti, inviò una lettera al governatore della Corsica Lord Elliot, chiedendo aiuto agli inglesi in caso di una nuova invasione francese. Santuccio sottopose la lettera anche all'assessore civile della Reale Governazione Andrea Flores, che diede la conferma di invio sia all'indirizzo di Lord Elliot che al ministro della Guerra a Torino. Questa missiva era di fatto l'atto che mise in evidenza l'intenzione del governo sassarese di separarsi da Cagliari.", "1795 7 9", "", ""], ["Morte Planargia", "Durante la seduta congiunta degli stamenti del 22 luglio, vennero lette le carte sequestrate a Planargia il 6 luglio. Quelle carte erano il capo d'accusa più probante dei disegni eversivi di Pitzolo e Planargia e, tra queste, vennero rinvenute delle vere e proprie liste di proscrizione. Nel corso della lettura l'ira popolare raggiunse il culmine e un gruppo di miliziani fece irruzione nella prigione e uccise Planargia.", "1795 7 22", "", ""], ["Vivalda viene a conoscenza della missiva", "Il viceré Vivalda riceve una lettera dal governatore di Sassari in cui viene informato che gli insorti cagliaritani avevano sollecitato una nuova spedizione francese. Inoltre vi era comunicato il contenuto della missiva inoltrata a Lord Elliot e al ministro della guerra.", "1795 7 31", "", ""], ["La reazione di Vivalda", "Il viceré Vivalda scrisse a Santuccio, a Lord Elliot e al ministro Cravanzana. Santuccio venne accusato di insubordinazione e gli fu ordinato di arrestare Andrea Flores; a Lord Elliot fu comunicato di non interferire negli affari della Sardegna; mentre il ministro Cravanzana veniva informato del gravissimo atto di insubordinazione dei sassaresi.", "1795 8 2", "", ""], ["La memoria al sovrano", "Poichè il partito novatore aveva incoraggiato dei movimenti antifeudali nel Capo settentrionale, la nobiltà sassarese inviò una memoria al sovrano in cui denunciavano la collusione tra il governo viceregio e il partito dei novatori. A causa di questa presunta collusione, essi chiedevano il diritto di non obbedire agli ordini del viceré e paventavano l'imminenza di una insurrezione generale nel capo settentrionale.", "1795 8 8", "", ""], ["Circolare viceregia", "Circolare viceregia che invitava i sindaci e i consigli comunitativi delle ville infeudate a fare istanza al governo contro gli abusi dei feudatari. Questa circolare rese possibile saldare il rapporto tra i normatori cittadini e il movimento antifeudale nelle campagne.", "1795 8 10", "", ""], ["I Regi Biglietti", "Il governo di Torino inviò tre regi biglietti in Sardegna, firmati dal sovrano ma sotto la forte influenza del ministro Galli della Loggia, due indirizzati al viceré e uno al governatore Santuccio. Nei biglietti recapitati al viceré veniva intimato di fermare il condizionamento degli Stamenti e del popolo cagliaritano sul popolo del Capo settentrionale. Ma il biglietto indirizzato a Santuccio fu quello che fece più scalpore. Infatti Galli della Loggia autorizzava i sassaresi a non obbedire agli ordini viceregi qualora gli avessero ritenuti contrari ai propri interessi, creando così tutti i presupposti per cui i sassaresi potessero chiedere la separazione dal capo meridionale.", "1795 8 29", "", ""], ["La richiesta di separazione dal Capo di Cagliari", "I ceti sassaresi si riunirono in assemblea e inviarono una rappresentanza al sovrano in cui richiedevano formalmente la separazione del Capo di Sassari da quello di Cagliari.", "1795 9 19", "", ""], ["La missione dell'arcivescovo Melano", "Il viceré e gli Stamenti corsero ai ripari chiedendo al sovrano di accogliere le cinque domande, dalle quali sarebbe dipesa la pacificazione dell'isola. Fu incaricato della missione l'arcivescovo Melano che passò prima per Roma per chiedere l'intercessione del Pontefice sul Re per ottenere sia la clemenza che l'accettazione delle cinque domande.", "1795 9 28", "", ""], ["Il pregone di Santuccio", "Santuccio emanò un pregone illegittimo in dispregio dell'autorità viceregia, in cui ordinava alla popolazione del Capo settentrionale di obbedire esclusivamente ai suoi ordini e di non ottemperare alle disposizioni viceregie.", "1795 10 12", "", ""], ["La campagna antifeudale", "Vivalda, in risposta al pregone del 12 ottobre emanato da Santuccio, inviò una delegazione, composta da cinque commissari, guidati da Francesco Cilocco, nelle ville del Logudorese con lo scopo di dare inizo ad una campagna antifeudale che avrebbe dovuto abbattere il governo sassarese.", "1795 10 23", "", ""], ["Primo \"Strumento di unione e di concordia\"", "I comuni di Thiesi, Cheremule e Bessude firmano il primo \"Strumento di unione e concordia\", ovvero un atto notarile in cui i comuni dichiaravano di non riconoscere più l'autorità del feudatario e di voler riscattare i carichi feudali tramite indennizzo. L'abolizione del feudalesimo assumeva in questo modo una connotazione legale.", "1795 11 24", "", ""], ["L'assedio di Sassari", "Un esercito antifeudale composto da circa tre o quattromila uomini, circondò la città di Sassari. La città fu presto assediata anche grazie all'indifferenza della popolazione sassarese. Il governatore Santuccio diede ordine di resa e accettò le condizioni imposte da Cilocco e Mundula: riconoscimento dell'autorità viceregia e nuovo governo della città, arresto sia di Santuccio che dell'arcivescovo Della Torre e traduzione di entrambi a Cagliari.", "1795 12 28", "", ""], ["Cilocco e Mundula lasciano Sassari", "Cilocco e Mundula lasciano Sassari per fare ritorno a Cagliari, scortati da molti armati, e portandosi dietro i prigionieri Santuccio e Della Torre.", "1795 12 31", "", ""], ["Angioy alternos", "Giovanni Maria Angioy fu nominato alternos con il compito di riportare alla normalità la situazione nel Logudoro. Infatti i moti antifeudali si trasformarono in guerriglia e si temeva la reazione dei baroni. Solo una figura di spicco come Angioy che fu il principale esponente dei novatori poteva riportare la situazione sui binari giusti.", "1796 1 16", "", ""], ["La cacciata degli angioiani", "Durante la seduta straordinaria del pomeriggio del primo aprile, gli Stamenti, su proposta di Vincenzo Sulis, decretarono l'espulsione da Cagliari di tutti i seguaci più accesi del partito angioiano, tra cui spiccavano i nomi di Gioacchino Mundula e Gavino Fadda.", "1796 4 1", "", ""], ["La partenza da Sassari", "Giovanni Maria Angioy cominciò la marcia verso Cagliari scortato dai vassalli intenzionati a chiedere l'abolizione del feudalesimo. L'alternos percorse tutto il Logudoro dove veniva accolto con grande entusiasmo in ogni villa e seguito via via da un numero sempre più cospicuo di cavalieri.", "1796 6 2", "37978", ""], ["L'arrivo a Macomer", "A Macomer le truppe angioiane trovarono una forte opposizione da parte degli abitanti.", "1796 6 6", "37978", ""], ["L'arrivo a Oristano", "Angioy e i suoi seguaci arrivarono a Oristano e furono accolti favorevolmente dalla popolazione. In quello stesso giorno scrisse una lettera indirizzata al viceré in cui chiedeva un abboccamento e, in caso di rifiuto, minacciava la separazione del Logudoro. Il giorno successivo scrisse una nuova lettera in cui propose la mediazione della Repubblica francese per dirimere le controversie in atto: questa proposta diede l'opportunità al viceré e agli Stamenti di bollarlo come traditore.\nAngioy e i suoi seguaci furono cacciati via dalla popolazione oristanese stanca dei continui saccheggi.", "1796 6 8", "37978", ""], ["Accettazione delle Cinque domande", "Il re Vittorio Amedeo III accoglie le cinque domande. La missione dell'arcivescovo Melano si concluse con un successo.", "1796 6 8", "", ""], ["Revoca della carica di alternos", "Il viceré Vivalda decise di revocare la carica di alternos ad Angioy e pose una taglia su di lui e sui suoi più stretti collaboratori. Il viceré concesse l'amnistia ai suoi seguaci che avrebbero deposto le armi e molti di questi abbandonarono la causa angioiana proprio perchè la sua azione non era più legale.\n Inoltre Cagliari venne messa in stato di difesa con la chiamata di circa 2500 miliziani, pronti ad opporsi alle truppe Logudoresi.", "1796 6 8 0 0", "37978", ""], ["Inizio repressione moti angioiani", "Pintor, Guiso, Musso e Delrio, partirono da Cagliari verso Oristano per reprimere una volta per tutte il moto angioiano.", "1796 6 10", "37978", ""], ["Il ritorno a Sassari", "Angioy rientra a Sassari accompagnato da ormai pochissimi suoi fedelissimi.", "1796 6 15", "37978", ""], ["Angioy lascia la Sardegna", "L'ormai ex alternos si imbarcò da Porto Torres verso Genova, incominciando così il suo esilio che lo porterà fino a Parigi.", "1796 6 16", "37978", ""], ["I faratelli Muroni e Auleri", "I fratelli Muroni e Cosimo Auleri con l'aiuto di altri angioiani cerarono di occupare e di far capitolare Sassari per liberare i detenuti Spanu e Mundula, ma fallirono. Tentarono di occupare anche Bonorva per ridare linfa vitale ai moti antifeudali, ma furono anche questa volta respinti.", "1796 9 17", "", ""], ["Morte di Vittorio Amedeo III", "Morì Vittorio Emanuele III e salì al trono Carlo Emanuele IV, che, qualche mese dopo, a causa dell'avanzata francese in Piemonte, fu costretto a trasferire la corte da Torino a Cagliari.\nNel frattempo a Cagliari e Sassari conservatori e forze feudali ripresero il controllo politico e sociale. Il triennio rivoluzionario sardo poteva dirsi concluso.", "1796 10 16", "", ""]]}</script>
<script>
// LETTURA CSV ONLINE. Nessuna libreria esterna, nessun contenuto eseguito.
function parseCSV(text){
 text=String(text).replace(/^\uFEFF/,'');
 if(/^\s*</.test(text))throw Error('Il collegamento ha restituito una pagina HTML anziché un CSV.');
 const first=text.split(/\r?\n/,1)[0],delimiter=first.includes(',')?',':';';
 const rows=[];let row=[],cell='',quoted=false,closed=false;
 const pushCell=()=>{row.push(cell);cell='';closed=false};
 const pushRow=()=>{pushCell();if(row.some(s=>s.trim()))rows.push(row);row=[]};
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else cell+=c;continue}
  if(c===delimiter){pushCell();continue}
  if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;pushRow();continue}
  if(c==='"'){if(cell!==''||closed)throw Error('Virgolette CSV non valide.');quoted=true;continue}
  if(closed){if(!/\s/.test(c))throw Error('Testo dopo la chiusura di un campo CSV.');continue}
  cell+=c;
 }
 if(quoted)throw Error('Un campo CSV contiene virgolette non chiuse.');
 if(cell!==''||row.length||closed)pushRow();return rows;
}
const $=id=>document.getElementById(id);
const months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function parseTime(value){
 const raw=String(value).trim();let y,m,d,h=0,min=0,hasTime=false;
 let match=raw.match(/^(\d{4})\s+(\d{1,2})\s+(\d{1,2})(?:\s+(\d{1,2})\s+(\d{1,2}))?$/);
 if(!match)match=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::00)?Z?)?$/);
 if(match){[y,m,d]=match.slice(1,4).map(Number);hasTime=match[4]!==undefined;if(hasTime){h=Number(match[4]);min=Number(match[5])}}
 else{match=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!match)throw Error('Time non riconosciuto: '+raw);d=Number(match[1]);m=Number(match[2]);y=Number(match[3])}
 const timestamp=Date.UTC(y,m-1,d,h,min),dt=new Date(timestamp);
 if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d||h<0||h>23||min<0||min>59)throw Error('Data o ora non valida: '+raw);
 const date=dt.toISOString().slice(0,10),label=d+' '+months[m-1]+' '+y+(hasTime?' · '+String(h).padStart(2,'0')+':'+String(min).padStart(2,'0'):'');
 return {timestamp,date,year:y,label,iso:hasTime?dt.toISOString():date};
}
function publicImageURL(value){
 const text=String(value||'').trim();if(!text)return '';
 try{const u=new URL(text);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}
}
function stableId(value){let hash=2166136261;for(let i=0;i<value.length;i++)hash=Math.imul(hash^value.charCodeAt(i),16777619);return 'evento-'+(hash>>>0).toString(36)}
function recordsFromRows(rows){
 if(!rows.length)throw Error('Il CSV è vuoto.');
 const norm=s=>String(s).trim().toLowerCase().replace(/[\s_-]/g,'');
 const header=rows[0].map(norm);if(new Set(header).size!==header.length)throw Error('Intestazioni duplicate.');
 for(const required of ['name','description','time'])if(!header.includes(required))throw Error('Colonna mancante: '+required);
 const records=[],ids=new Set();
 for(let i=1;i<rows.length;i++){
  const row=rows[i];if(row.every(c=>!String(c).trim()))continue;
  try{
   if(row.length!==header.length)throw Error('Numero di campi diverso dalle intestazioni.');
   const r=Object.fromEntries(header.map((k,j)=>[k,String(row[j]??'')]));
   const name=r.name.trim();if(!name)throw Error('Name è vuoto.');
   const date=parseTime(r.time),group=(r.groupid||'').trim(),id=(r.id||'').trim()||stableId(name+'|'+r.time.trim()+'|'+group);
   if(ids.has(id))throw Error('Identificativo duplicato: '+id);ids.add(id);
   const imageRaw=(r.urlimmagine||r.imageurl||r.urlimage||'').trim();
   records.push({id,name,description:r.description.replace(/\\n/g,'\n'),time:r.time,group,image:publicImageURL(imageRaw),imageRaw,...date,sourceIndex:i});
  }catch(error){throw Error('Record '+(i+1)+': '+error.message)}
 }
 return records.sort((a,b)=>a.timestamp-b.timestamp||a.sourceIndex-b.sourceIndex);
}
const embedded=JSON.parse($('embedded').textContent);
let records=recordsFromRows([embedded.headers,...embedded.rows]),visible=[],index=-1,selectedId=null,playTimer=null,loading=false,lastCSV=null,remoteLoaded=false;
for(const [key,value]of Object.entries(CONFIG.colori))document.documentElement.style.setProperty('--'+key,value);
document.documentElement.style.setProperty('--img-height',Math.max(100,CONFIG.immagini.altezzaMassimaPx)+'px');
$('title').textContent=CONFIG.titolo;$('subtitle').textContent=CONFIG.sottotitolo;document.title=CONFIG.titolo+' · Timeline';
function pause(){if(playTimer!==null){clearInterval(playTimer);playTimer=null}$('play').textContent='Riproduci'}
function fillYears(){const prev=$('year').value,years=[...new Set(records.map(r=>r.year))];$('year').replaceChildren();const all=document.createElement('option');all.value='';all.textContent='Tutti gli anni';$('year').appendChild(all);for(const year of years){const option=document.createElement('option');option.value=String(year);option.textContent=String(year);$('year').appendChild(option)}$('year').value=years.includes(Number(prev))?prev:'';const first=records[0],last=records.at(-1);$('period').textContent=first?(first.year===last.year?String(first.year):first.year+'–'+last.year):'Nessun evento'}
function refreshList(){const box=$('eventList');box.replaceChildren();for(const [i,r]of visible.entries()){const b=document.createElement('button');b.type='button';b.className='event-item';b.id='event-'+r.id;b.setAttribute('aria-current',String(r.id===selectedId));const time=document.createElement('time');time.dateTime=r.iso;time.textContent=r.label;const title=document.createElement('span');title.textContent=r.name;b.appendChild(time);b.appendChild(title);b.onclick=()=>{pause();select(i)};box.appendChild(b)}}
function eventLinks(parent,items){parent.replaceChildren();for(const r of items){const b=document.createElement('button');b.type='button';b.textContent=r.name;b.onclick=()=>{pause();const i=visible.findIndex(v=>v.id===r.id);if(i>=0)select(i)};parent.appendChild(b)}}
function renderImage(r){
 const box=$('imageBox');box.replaceChildren();box.hidden=true;if(!CONFIG.immagini.mostra||!r.imageRaw)return;
 box.hidden=false;
 if(!r.image){const p=document.createElement('figcaption');p.textContent='Il collegamento all’immagine non è valido: usa un URL pubblico http o https.';box.appendChild(p);return}
 const a=document.createElement('a');a.href=r.image;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','Apri immagine: '+r.name);
 const img=document.createElement('img');img.alt=r.name;img.decoding='async';img.referrerPolicy='no-referrer';img.src=r.image;
 img.onerror=()=>{img.hidden=true;const message=document.createElement('figcaption');message.textContent='Immagine non disponibile. Apri il collegamento per verificarla.';a.textContent='Apri immagine';box.appendChild(message)};
 a.appendChild(img);box.appendChild(a);
}
function select(i){
 if(i<0||i>=visible.length)return;index=i;const r=visible[i];selectedId=r.id;
 $('content').hidden=false;$('empty').hidden=true;$('storyDate').dateTime=r.iso;$('storyDate').textContent=r.label;$('currentDate').textContent=r.label;$('storyTitle').textContent=r.name;$('description').textContent=r.description||'Nessuna descrizione disponibile.';
 $('slider').value=String(i);$('slider').setAttribute('aria-valuetext',r.label+' · '+r.name);$('position').textContent='Evento '+(i+1)+' di '+visible.length;$('previous').disabled=i===0;$('next').disabled=i===visible.length-1;
 renderImage(r);const sameDay=visible.filter(e=>e.date===r.date&&e.id!==r.id);$('sameDay').hidden=!sameDay.length;eventLinks($('sameDayList'),sameDay);
 const related=r.group?visible.filter(e=>e.group===r.group&&e.id!==r.id):[];$('related').hidden=!related.length;$('relatedToggle').textContent='Eventi collegati ('+related.length+')';$('relatedToggle').setAttribute('aria-expanded','false');$('relatedList').hidden=true;eventLinks($('relatedList'),related);
 refreshList();drawAxis();
}
function applyFilters(){
 pause();const q=$('search').value.trim().toLocaleLowerCase('it'),year=$('year').value;
 visible=records.filter(r=>(!year||String(r.year)===year)&&(!q||(r.name+' '+r.description).toLocaleLowerCase('it').includes(q)));
 $('count').textContent=visible.length+' eventi su '+records.length;$('slider').max=String(Math.max(0,visible.length-1));$('slider').disabled=!visible.length;$('play').disabled=visible.length<2;
 let next=visible.findIndex(r=>r.id===selectedId);if(next<0)next=0;
 if(visible.length)select(next);else{index=-1;selectedId=null;$('content').hidden=true;$('empty').hidden=false;$('currentDate').textContent='Nessun evento';$('position').textContent='0 eventi';$('previous').disabled=true;$('next').disabled=true;refreshList();drawAxis()}
}
function svgElement(tag,attrs,parent=$('axis')){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}
function drawAxis(){
 const svg=$('axis'),width=Math.max(260,svg.getBoundingClientRect().width||800),height=90;svg.setAttribute('viewBox','0 0 '+width+' '+height);svg.replaceChildren();if(!visible.length)return;
 const left=24,right=width-24,min=visible[0].timestamp,max=visible.at(-1).timestamp,x=t=>max===min?width/2:left+(t-min)/(max-min)*(right-left);
 svgElement('line',{x1:left,y1:36,x2:right,y2:36,stroke:'#c9d1d5','stroke-width':2});
 const years=[...new Set(visible.map(r=>r.year))],step=Math.max(1,Math.ceil(years.length/(width<420?4:7)));let previousLabelRight=-Infinity;
 for(const [i,year]of years.entries()){if(i%step&&i!==years.length-1)continue;const t=Math.max(min,Math.min(max,Date.UTC(year,0,1))),px=x(t),anchor=i===0?'start':i===years.length-1?'end':'middle',labelLeft=anchor==='start'?px:anchor==='end'?px-32:px-16;if(labelLeft<previousLabelRight+8)continue;previousLabelRight=labelLeft+32;svgElement('line',{x1:px,y1:56,x2:px,y2:62,stroke:'#b6c0c7'});const text=svgElement('text',{x:px,y:79,'text-anchor':anchor});text.textContent=String(year)}
 const groups=new Map();for(const r of visible){if(!groups.has(r.date))groups.set(r.date,[]);groups.get(r.date).push(r)}
 for(const group of groups.values()){const active=group.some(r=>r.id===selectedId),px=x(group[0].timestamp);const g=svgElement('g',{class:'dot',role:'button',tabindex:0,'aria-label':group[0].label+' · '+group.length+' eventi'});svgElement('circle',{cx:px,cy:36,r:12,fill:'transparent'},g);svgElement('circle',{cx:px,cy:36,r:active?8:group.length>1?5:3.5,fill:active?CONFIG.colori.accento:CONFIG.colori.secondario,stroke:CONFIG.colori.scheda,'stroke-width':active?2:1},g);const title=svgElement('title',{},g);title.textContent=group.map(r=>r.label+' · '+r.name).join('\n');g.onclick=()=>{pause();select(visible.findIndex(r=>r.id===group[0].id))};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.onclick()}}}
}
$('previous').onclick=()=>{pause();select(index-1)};$('next').onclick=()=>{pause();select(index+1)};$('slider').oninput=e=>{pause();select(Number(e.target.value))};$('search').oninput=applyFilters;$('year').onchange=applyFilters;
$('relatedToggle').onclick=()=>{const list=$('relatedList');list.hidden=!list.hidden;$('relatedToggle').setAttribute('aria-expanded',String(!list.hidden))};
$('play').onclick=()=>{if(playTimer!==null){pause();return}if(visible.length<2)return;if(index>=visible.length-1)select(0);$('play').textContent='Pausa';playTimer=setInterval(()=>{if(index>=visible.length-1){pause();return}select(index+1)},Math.max(.5,CONFIG.secondiPerEvento)*1000)};
fillYears();applyFilters();if(CONFIG.dataIniziale){const start=visible.findIndex(r=>r.date>=CONFIG.dataIniziale);if(start>=0)select(start)}
new ResizeObserver(drawAxis).observe($('axis'));if(CONFIG.riproduzioneAutomatica&&visible.length>1)$('play').onclick();
async function refreshOnline(){
 if(loading||!CONFIG.urlCSV)return;loading=true;$('refresh').disabled=true;$('dataStatus').textContent='Aggiornamento dal foglio…';$('detailError').hidden=true;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),Math.max(3,CONFIG.timeoutSecondi)*1000);
 try{const res=await fetch(CONFIG.urlCSV,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);const text=await res.text();if(text!==lastCSV){const next=recordsFromRows(parseCSV(text));records=next;lastCSV=text;remoteLoaded=true;fillYears();applyFilters()}$('dataStatus').textContent='Dati dal foglio Google · '+records.length+' eventi · controllo '+new Date().toLocaleTimeString('it-IT');}
 catch(error){$('dataStatus').textContent=remoteLoaded?'Aggiornamento non riuscito. Mantengo gli ultimi dati caricati.':'Foglio non raggiungibile. Visualizzazione della copia salvata ('+records.length+' eventi).';$('detailError').textContent=error.name==='AbortError'?'Tempo di attesa scaduto.':error.message;$('detailError').hidden=false}
 finally{clearTimeout(timer);loading=false;$('refresh').disabled=false}
}
$('refresh').onclick=refreshOnline;
if(CONFIG.urlCSV){refreshOnline();if(CONFIG.aggiornaOgniSecondi>0)setInterval(()=>{if(!document.hidden)refreshOnline()},Math.max(15,CONFIG.aggiornaOgniSecondi)*1000)}

</script>
</body></html>
